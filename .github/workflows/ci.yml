name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - lint e build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_AUTH0_DOMAIN: example.auth0.com
      VITE_AUTH0_CLIENT_ID: ci-client-id
      VITE_AUTH0_AUDIENCE: https://api.sistema-orcamentos
      VITE_API_BASE_URL: http://localhost:3000

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Verificar o código
        run: npm run lint

      - name: Testes de unidade do frontend
        run: npm run test:unit

      - name: Preparar o navegador dos testes de aceite
        run: npx playwright install --with-deps chromium

      - name: Testes de aceite da interface
        run: npm run test:acceptance

      - name: Construir o frontend
        run: npm run build

  backend:
    name: Backend - migrations e testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      AUTH0_DOMAIN: example.auth0.com
      AUTH0_AUDIENCE: https://api.sistema-orcamentos
      CLIENT_ORIGIN_URL: http://localhost:5173
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: sistema_orcamentos
      DB_USER: sistema_orcamentos_app
      DB_PASSWORD: ci_only_password

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sistema_orcamentos
          POSTGRES_USER: sistema_orcamentos_app
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sistema_orcamentos_app -d sistema_orcamentos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Preparar o npm
        run: npm install --global npm@11.6.2

      - name: Instalar as dependências
        run: npm ci --include=dev

      - name: Aplicar as migrations
        run: npm run db:migrate

      - name: Executar os testes
        run: npm test

  infrastructure:
    name: Infraestrutura - plano do Railway
    runs-on: ubuntu-latest

    # Somente leitura: compara .railway/railway.ts com o ambiente de produção e nunca aplica mudanças.
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Conferir o token do Railway
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Cadastre o secret RAILWAY_TOKEN (token de projeto do ambiente production)."
            exit 1
          fi

      - name: Instalar o SDK de infraestrutura
        run: npm ci

      - name: Instalar o CLI do Railway
        run: |
          npm install --global @railway/cli
          railway --version

      - name: Comparar a configuração com o Railway
        run: railway config plan
